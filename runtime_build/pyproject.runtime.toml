# APEX Runtime — pyproject filtré, distinct de celui de APEX DEV.
#
# Copié tel quel (jamais généré dynamiquement) dans chaque artefact construit
# par `runtime_build/build.py`. Ne déclare AUCUNE dépendance de dev/test
# (pas de pytest/ruff/mypy/hypothesis/httpx) — voir runtime_build/README.md.

[project]
name = "apex-runtime"
version = "0.1.2"
description = "APEX Runtime — sous-ensemble distribuable du noyau d'exécution (missions, agents, sandbox, API, doctor, gate)."
requires-python = ">=3.12"

# Miroir du noyau DEV : apex/config/loader.py importe PyYAML de façon
# paresseuse (le noyau reste stdlib pur sans elle, même règle que DEV).
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Même composition que les extras `db`/`api` de APEX DEV (pyproject.toml,
# racine du dépôt) : la chaîne Alembic officielle et l'image Postgres
# pgvector sont partagées avec DEV par décision explicite (une seule chaîne
# de migrations, voir runtime_build/README.md) — y compris `pgvector`, bien
# qu'aucun module Runtime n'utilise encore de colonne `Vector` en Python.
db  = ["sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2", "pgvector>=0.3"]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.9"]
# Inférence NATIVE en processus (apex.models.native) : le Runtime exécute un vrai modèle sans serveur.
native = ["torch>=2.4", "transformers>=4.45,<5", "safetensors>=0.4", "huggingface_hub>=0.25"]
# Game Studio is optional so missing Blender/graphics libraries never prevent
# the launcher or core API from opening. Weights are intentionally excluded.
game_studio = ["psutil>=5.9", "numpy>=1.26", "pillow>=10", "llama-cpp-python>=0.3"]

[project.scripts]
apex = "apex.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apex"]
