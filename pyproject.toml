[project]
name = "apex"
version = "0.1.2"
description = "Plateforme locale d'intelligence artificielle évolutive pour le développement logiciel"
requires-python = ">=3.12"

# Phase 1 : PyYAML uniquement. Le noyau (errors, obs, config, doctor, cli) est
# volontairement stdlib pur — `apex doctor` doit diagnostiquer un environnement
# où rien n'est installé, y compris lui-même.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Ajoutées phase par phase, quand leur sous-système existe réellement.
db  = ["sqlalchemy>=2.0", "alembic>=1.13", "psycopg[binary]>=3.2", "pgvector>=0.3"]  # phase 2
api = ["fastapi>=0.115", "uvicorn[standard]>=0.32", "pydantic>=2.9"]                 # phase 10
# apex.desktop (contrôle réel clavier/souris, --allow-desktop-control) : exige un écran réel,
# jamais utilisable depuis un conteneur/CI headless — voir apex/desktop/pyautogui_backend.py.
# apex.neural (modèle natif d'APEX : autograd/backprop). CPU suffit ; CUDA si présent.
neural = ["torch>=2.4"]
desktop = ["pyautogui>=0.9.54", "psutil>=6.0", "pygetwindow>=0.0.9 ; sys_platform == 'win32'"]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7", "mypy>=1.13", "hypothesis>=6.115",
       "httpx>=0.27"]  # requis par fastapi.testclient.TestClient

[project.scripts]
apex = "apex.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["apex"]

[tool.ruff]
line-length = 108
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]  # assert autorisé dans les tests

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

# Typage strict sur les modules où une erreur silencieuse serait grave :
# frontière de sûreté du Genome, sécurité, configuration.
[[tool.mypy.overrides]]
module = ["apex.config.*", "apex.interfaces.*", "apex.errors"]
strict = true

# Dépendances optionnelles de l'extra `desktop`, sans stubs de types publiés
# (ou, pour pygetwindow, sans paquet `types-*` du tout) — importées
# uniquement en retard (voir apex/desktop/pyautogui_backend.py), jamais au
# niveau module.
[[tool.mypy.overrides]]
module = ["pyautogui", "psutil", "pygetwindow"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["apex"]
branch = true
