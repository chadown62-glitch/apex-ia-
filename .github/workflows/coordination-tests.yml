name: APEX coordination adversarial tests
on:
  pull_request:
    branches: [apex/integration]
permissions:
  contents: read
jobs:
  adversarial-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Untrusted test code has no secrets and no persisted credentials.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -I -m unittest discover -s tests -p test_coordination_guard.py -v
