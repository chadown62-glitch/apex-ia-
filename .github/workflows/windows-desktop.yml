# APEX Desktop sur un Windows RÉEL hébergé par GitHub (Windows Server, VM sans WSL2).
# Ce n'est PAS Windows 10/11 client ni le PC de l'utilisateur : chaque résultat est étiqueté
# « REAL WINDOWS SERVER (GitHub-hosted) ». Rien ici ne vaut preuve WSL2.
name: windows-desktop

on:
  workflow_dispatch:
  push:
    branches: [claude/apex-official-development-4kao8t]
    paths:
      - ".github/workflows/windows-desktop.yml"
      - "setup/**"

permissions:
  contents: read

jobs:
  facts:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Environment facts (OS, wsl.exe raw output and exit codes, Lxss registry)
        shell: pwsh
        run: |
          $out = New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP\facts"
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber, OSArchitecture |
            Format-List | Out-String | Tee-Object "$out\os.txt"
          $wsl = Get-Command wsl.exe -ErrorAction SilentlyContinue
          "wsl.exe: $($wsl.Source)" | Tee-Object "$out\wsl_path.txt"
          & { foreach ($case in @(@('-l','-v'), @('-l','--running','-q'), @('-l','-q'), @('--status'), @('--version'))) {
            $name = ($case -join '_') -replace '[^A-Za-z0-9_]', ''
            foreach ($utf8 in @('', '1')) {
              $env:WSL_UTF8 = $utf8
              $psi = [System.Diagnostics.ProcessStartInfo]::new('wsl.exe')
              foreach ($a in $case) { $psi.ArgumentList.Add($a) }
              $psi.RedirectStandardOutput = $true; $psi.RedirectStandardError = $true; $psi.UseShellExecute = $false
              try {
                $p = [System.Diagnostics.Process]::Start($psi)
                $ms = [System.IO.MemoryStream]::new(); $p.StandardOutput.BaseStream.CopyTo($ms)
                $err = $p.StandardError.ReadToEnd(); $p.WaitForExit(15000) | Out-Null
                $bytes = $ms.ToArray()
                [System.IO.File]::WriteAllBytes("$out\wsl_${name}_utf8$utf8.stdout.bin", $bytes)
                "== wsl $($case -join ' ') (WSL_UTF8=$utf8) exit=$($p.ExitCode) bytes=$($bytes.Length) stderr=[$err]"
                "   hex(0..96): " + (($bytes | Select-Object -First 96 | ForEach-Object { $_.ToString('x2') }) -join ' ')
                "   as UTF-16LE: " + [System.Text.Encoding]::Unicode.GetString($bytes)
              } catch { "== wsl $($case -join ' ') : cannot start ($($_.Exception.Message))" }
            }
          } } *>&1 | Tee-Object "$out\wsl_outputs.txt"
          $env:WSL_UTF8 = ''
          Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Lxss' -ErrorAction SilentlyContinue |
            ForEach-Object { Get-ItemProperty $_.PSPath | Select-Object DistributionName, Version, State } |
            Format-List | Out-String | Tee-Object "$out\lxss.txt"
          "Lxss key exists: $(Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Lxss')" | Tee-Object -Append "$out\lxss.txt"
      - name: Can this runner host a real WSL2 distribution? (experiment, never assumed)
        shell: pwsh
        continue-on-error: true
        run: |
          $out = "$env:RUNNER_TEMP\facts"
          & {
            "== wsl --install -d Ubuntu-24.04 --no-launch"
            wsl.exe --install -d Ubuntu-24.04 --no-launch --web-download; "exit=$LASTEXITCODE"
            $env:WSL_UTF8 = '1'
            "== wsl -l -v"; wsl.exe -l -v; "exit=$LASTEXITCODE"
            "== run a command in the distribution (WSL2 needs virtualization on this VM)"
            wsl.exe -d Ubuntu-24.04 -u root --exec uname -a; "exit=$LASTEXITCODE"
            "== wsl -l -v after first start"; wsl.exe -l -v; "exit=$LASTEXITCODE"
            "== running"; wsl.exe -l --running -q; "exit=$LASTEXITCODE"
            Get-ChildItem 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Lxss' -ErrorAction SilentlyContinue |
              ForEach-Object { Get-ItemProperty $_.PSPath | Select-Object DistributionName, Version, State, BasePath } | Format-List
            (Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Lxss' -ErrorAction SilentlyContinue).DefaultDistribution
          } *>&1 | Tee-Object "$out\wsl2_experiment.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-facts
          path: ${{ runner.temp }}/facts

  # Installateurs construits SUR Windows (Inno Setup 6.4.3 figé, natif), puis script de validation
  # setup/packaging/windows/Test-ApexWindows.ps1 exécuté par Windows PowerShell 5.1 — le même script que
  # sur le PC de l'utilisateur — contre un vrai WSL2 et le vrai launch.sh. Windows Server hébergé :
  # pas Windows 10/11 client, pas de redémarrage (phases PreReboot/PostReboot non exécutées ici).
  real-windows:
    runs-on: windows-latest
    timeout-minutes: 220
    env:
      DISTRO: Ubuntu-24.04
    steps:
      - name: No CRLF conversion (bash scripts run inside WSL)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Static check of the validation script for Windows PowerShell 5.1
        shell: powershell
        run: |
          $PSVersionTable.PSVersion.ToString()
          Install-PackageProvider NuGet -MinimumVersion 2.8.5.201 -Force -Scope CurrentUser | Out-Null
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck
          $settings = @{ Rules = @{ PSUseCompatibleSyntax = @{ Enable = $true; TargetVersions = @('5.1') } } }
          $issues = foreach ($f in 'Test-ApexWindows.ps1', 'Prouver-Boucle-APEX.ps1') { Invoke-ScriptAnalyzer -Path "setup/packaging/windows/$f" -Settings $settings -Severity Error }
          $issues | Format-Table Line, RuleName, Message -Wrap -AutoSize | Out-String -Width 200
          # Analyse par Windows PowerShell 5.1 LUI-MÊME, avec la détection d'encodage qu'il applique à
          # l'exécution (constaté au run 8 : sans BOM, le fichier UTF-8 était lu en Windows-1252 et
          # « — » devenait un guillemet — erreur que PSScriptAnalyzer n'avait pas vue).
          $tokens = $null; $errors = $null
          $allErrors = @()
          foreach ($f in 'Test-ApexWindows.ps1', 'Prouver-Boucle-APEX.ps1') {
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "setup/packaging/windows/$f").Path, [ref]$tokens, [ref]$errors) | Out-Null
            $errors | ForEach-Object { "$f $($_.Extent.StartLineNumber): $($_.Message)" }
            $allErrors += $errors
          }
          if ($issues -or $allErrors) { exit 1 }
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Runtime libraries for the anti-leak check (the exact Windows lock, verified by hashes)
        shell: bash
        run: |
          # build_desktop_release.sh IMPORTE chaque module de l'application qu'il embarque : sans ces bibliothèques,
          # le contrôle anti-fuite échoue (cause de la CI rouge depuis 2a38110, identifiée le 16/10/2026).
          python -m pip install --disable-pip-version-check --no-input --require-hashes --only-binary=:all: --no-deps \
            -r setup/packaging/runtime/requirements-windows.lock
          echo "APEX_BUILD_PYTHON=$(python -c 'import sys; print(sys.executable)')" >> "$GITHUB_ENV"
      - name: Build the installers on Windows (current and previous release)
        shell: bash
        run: |
          command -v python3 >/dev/null || { mkdir -p "$HOME/shim"; printf '#!/bin/sh\nexec python "$@"\n' > "$HOME/shim/python3"; chmod +x "$HOME/shim/python3"; echo "$HOME/shim" >> "$GITHUB_PATH"; export PATH="$HOME/shim:$PATH"; }
          ISCC=$(bash setup/packaging/fetch_innosetup.sh "$RUNNER_TEMP/toolchain" | tail -1)
          ISCC="$ISCC" bash setup/packaging/build_desktop_release.sh "$RUNNER_TEMP/release"
          # Version précédente (0.2.1, commit 4a37092) pour le test de mise à jour : son code, avec le
          # script de build actuel (celui de 4a37092 ne gérait pas encore les chemins Windows natifs).
          git worktree add "$RUNNER_TEMP/prev" 4a37092
          cp setup/packaging/build_desktop_release.sh "$RUNNER_TEMP/prev/setup/packaging/build_desktop_release.sh"
          ISCC="$ISCC" bash "$RUNNER_TEMP/prev/setup/packaging/build_desktop_release.sh" "$RUNNER_TEMP/release-prev"
          cat "$RUNNER_TEMP/release/manifest.json"
      - name: Real WSL2 distribution, prepared like a user's machine
        shell: pwsh
        run: |
          wsl.exe --install -d $env:DISTRO --no-launch --web-download
          wsl.exe --set-default $env:DISTRO
          $src = (wsl.exe -d $env:DISTRO -u root --exec wslpath -a ($env:GITHUB_WORKSPACE -replace '\\','/')).Trim()
          wsl.exe -d $env:DISTRO -u root --exec bash "$src/setup/packaging/windows/ci/prepare_wsl_backend.sh" $src apex
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          wsl.exe --terminate $env:DISTRO
      - name: Validation script (Windows PowerShell 5.1, real WSL2, real launch.sh)
        shell: powershell
        run: |
          # Ce script valide le mode WSL (launch.sh dans la distribution). Depuis 2a38110, l'APEX.exe INSTALLÉ passe de
          # lui-même en mode Windows natif (application à côté de lui) : sans ce réglage, le Panel ne regardait jamais
          # WSL (W01 à W04, B01 à B03 en échec depuis le 08/10). Le mode natif est validé par windows-native.
          $env:APEX_PANEL_MODE = 'wsl'
          $new = Get-ChildItem "$env:RUNNER_TEMP\release" -Filter 'APEX-Setup-x64-v*.exe' | Select-Object -First 1
          $old = Get-ChildItem "$env:RUNNER_TEMP\release-prev" -Filter 'APEX-Setup-x64-v*.exe' | Select-Object -First 1
          & setup/packaging/windows/Test-ApexWindows.ps1 -Installer $new.FullName -OlderInstaller $old.FullName `
            -AllowBackendControl -AllowWslShutdown -AuditProcessCreation -Repeat 1 -Label 'ci-windows-server-hosted' `
            -OutDir "$env:RUNNER_TEMP\validation"
      # Le journal du runner n'est pas lisible par l'API : les contrôles FAIL et BLOCKED de results.json le sont, en
      # annotations (check-runs/<id>/annotations). Exécuté même si le script a échoué.
      - name: Publish the validation checks (annotations)
        if: always()
        shell: pwsh
        run: |
          $f = Get-ChildItem "$env:RUNNER_TEMP\validation" -Filter 'results*.json' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $f) { Write-Host "::warning title=Validation::results.json absent"; exit 0 }
          $r = Get-Content $f.FullName -Raw -Encoding utf8 | ConvertFrom-Json
          $lines = @("PASS $($r.summary.PASS) ; FAIL $($r.summary.FAIL) ; BLOCKED $($r.summary.BLOCKED) ; NOT_APPLICABLE $($r.summary.NOT_APPLICABLE)")
          $lines += $r.checks | Where-Object { $_.status -in 'FAIL', 'BLOCKED' } | ForEach-Object { "$($_.status) $($_.id) $($_.title) : $($_.detail)" }
          $t = ($lines -join "`n") -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
          if ($t.Length -gt 8000) { $t = $t.Substring(0, 8000) }
          Write-Host "::notice title=Validation Windows (WSL2)::$t"
      # Contrat de démarrage (5736ec9) prouvé sur le vrai WSL2 par le vrai launch.sh, sans aucune dérogation :
      # décision et codes de sortie imprimés dans CE journal (le journal de launch.sh de l'étape précédente
      # n'est lisible que dans l'artefact). Les cas d'échec sont des fautes réelles injectées dans des copies.
      - name: Startup-gate contract on the real WSL2 launcher (evidence, no gate exception)
        if: always()
        shell: pwsh
        run: |
          $src = (wsl.exe -d $env:DISTRO -u root --exec wslpath -a ($env:GITHUB_WORKSPACE -replace '\\','/')).Trim()
          wsl.exe -d $env:DISTRO --cd /home/apex --exec bash "$src/setup/packaging/windows/ci/startup_contract_evidence.sh" /home/apex/apex
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: The Panel (APEX.exe) shows that real Startup Gate refusal as BLOCKED, then clears it
        if: always()
        shell: pwsh
        run: |
          # Refus RÉEL enregistré par l'étape précédente (3b : launch.sh panel-serve, FAIL mesuré GATE-21).
          $exe = Get-ChildItem "$env:RUNNER_TEMP\release\publish" -Recurse -Filter APEX.exe | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP 'panel-blocked.json'
          $p = Start-Process -FilePath $exe.FullName -ArgumentList '--status-json' -NoNewWindow -Wait -PassThru -RedirectStandardOutput $out
          $s = Get-Content $out -Raw -Encoding UTF8 | ConvertFrom-Json
          Write-Host "APEX.exe --status-json : code $($p.ExitCode) ; $($s.headline) / $($s.cause)"
          Write-Host "guidance : $($s.guidance)"
          wsl.exe -d $env:DISTRO --cd /home/apex/apex --exec bash scripts/apex-launch.sh stop
          $ok = $p.ExitCode -eq 4 -and $s.verdict -eq 'Blocked' -and $s.cause -eq 'StartupRefused' -and $s.guidance -match 'GATE-21' -and $s.guidance -match 'Startup Gate'
          if (-not $ok) { Write-Host 'FAIL : le Panel ne montre pas ce refus réel comme APEX BLOCKED'; exit 1 }
          Write-Host 'PASS : refus réel du Startup Gate affiché APEX BLOCKED (GATE-21 cité), jamais contourné'
      # Première boucle d'exécution RÉELLE : Task -> TaskRun -> modèle réel (Ollama + qwen2.5-coder:7b-instruct,
      # le modèle de la machine cible, sur le CPU du runner) -> code généré exécuté dans la sandbox choisie
      # par le runtime -> Oracle sur tests cachés -> Experience -> persistance après redémarrage. APEX est
      # démarré et redémarré par le Panel publié (APEX.exe --start/--stop -> launch.sh panel-serve -> Startup
      # Gate), sans aucune dérogation. Un maillon absent est BLOCKED, jamais PASS (first_real_loop.py).
      - name: First real execution loop (real model, real sandbox, judge, experience, restart)
        if: always()
        shell: pwsh
        timeout-minutes: 110
        run: |
          $src = (wsl.exe -d $env:DISTRO -u root --exec wslpath -a ($env:GITHUB_WORKSPACE -replace '\\','/')).Trim()
          wsl.exe -d $env:DISTRO -u root --exec bash "$src/setup/packaging/windows/ci/prepare_real_model.sh" /home/apex/apex
          if ($LASTEXITCODE -ne 0) { Write-Host 'BLOCKED : Ollama ou le modèle n''a pas pu être installé'; exit 3 }
          $exe = (Get-ChildItem "$env:RUNNER_TEMP\release\publish" -Recurse -Filter APEX.exe | Select-Object -First 1).FullName
          # Réglages du Panel neufs : dossier APEX par défaut (~/apex de l'utilisateur), jamais une copie de test.
          $env:APEX_PANEL_CONFIG_DIR = (New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\panel-loop-config").FullName
          $env:APEX_PANEL_START_TIMEOUT_S = '870'
          # Attendre APEX.exe SEUL (comme Invoke-Native du script de validation) : `--start` laisse volontairement
          # tourner le backend (wsl.exe ... panel-serve) — `Start-Process -Wait` attendait aussi ce descendant et
          # n'a jamais rendu la main (run 20, délai de 75 min atteint).
          function Panel([string]$action) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $exe; $psi.Arguments = $action
            $psi.UseShellExecute = $false; $psi.CreateNoWindow = $true; $psi.RedirectStandardOutput = $true
            $psi.StandardOutputEncoding = [System.Text.Encoding]::UTF8
            $p = [Diagnostics.Process]::Start($psi)
            $read = $p.StandardOutput.ReadToEndAsync()
            if (-not $p.WaitForExit(900000)) { try { $p.Kill() } catch { }; Write-Host "APEX.exe $action : délai de 900 s dépassé"; return 98 }
            $s = $null; if ($read.Wait(30000)) { try { $s = $read.Result | ConvertFrom-Json } catch { } }
            Write-Host "APEX.exe $action : code $($p.ExitCode) ; $($s.headline) / $($s.cause)"
            if ($p.ExitCode -gt 1 -and $action -eq '--start') {
              Write-Host "guidance : $($s.guidance)"
              wsl.exe -d $env:DISTRO --exec bash -c 'tail -60 ~/.apex/runtime/launch.log' | Out-Host
            }
            return $p.ExitCode
          }
          # Run 23 : un arrêt a échoué sur une erreur du service WSL (Wsl/Service/0x8007274c) ; il est retenté
          # une fois. S'il échoue encore, la phase suivante le constate (même processus APEX : BLOCKED).
          function Stop-Apex {
            $c = Panel '--stop'
            if ($c -ne 0) { Start-Sleep -Seconds 20; $c = Panel '--stop' }
            return $c
          }
          function Loop([string]$phase) {
            wsl.exe -d $env:DISTRO --cd /home/apex/apex --exec .venv/bin/python "$src/setup/packaging/windows/ci/first_real_loop.py" $phase | Out-Host
            return $LASTEXITCODE
          }
          $codes = @()
          if ((Panel '--start') -gt 1) { Write-Host 'BLOCKED : APEX ne démarre pas (voir le verdict ci-dessus)'; exit 3 }
          $codes += Loop 'run'
          Stop-Apex | Out-Null
          if ((Panel '--start') -gt 1) { Write-Host 'FAIL : APEX ne redémarre pas'; exit 1 }
          $codes += Loop 'verify'
          $codes += Loop 'interrupt'
          Stop-Apex | Out-Null
          if ((Panel '--start') -gt 1) { Write-Host 'FAIL : APEX ne redémarre pas'; exit 1 }
          $codes += Loop 'interrupted'
          Stop-Apex | Out-Null
          wsl.exe -d $env:DISTRO --exec bash -c 'ollama ps; docker ps -a --filter name=apex_ --format "{{.Names}} {{.Status}}"'
          Write-Host "codes des phases (run, verify, interrupt, interrupted) : $($codes -join ', ')"
          if ($codes -contains 1) { exit 1 }
          if ($codes -contains 3) { exit 3 }
      # Expérience RUN 1 -> Experience -> RUN 2 (protocole pré-enregistré : docs/EXPERIENCE_RUN1_RUN2.md), avec le
      # VRAI modèle installé par l'étape précédente (1.5B sur ce runner, mesuré à 3,9 Go — preuve CI, jamais celle
      # de la machine cible). Aucune donnée fabriquée : le script ne fait que piloter l'API réelle.
      - name: Experience A/B experiment (RUN 1 -> RUN 2 baseline vs conditioned, real model)
        if: always()
        shell: pwsh
        timeout-minutes: 100
        run: |
          $src = (wsl.exe -d $env:DISTRO -u root --exec wslpath -a ($env:GITHUB_WORKSPACE -replace '\\','/')).Trim()
          $exe = (Get-ChildItem "$env:RUNNER_TEMP\release\publish" -Recurse -Filter APEX.exe | Select-Object -First 1).FullName
          $env:APEX_PANEL_CONFIG_DIR = (New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\panel-ab-config").FullName
          $env:APEX_PANEL_START_TIMEOUT_S = '870'
          function Panel([string]$action) {
            $psi = New-Object System.Diagnostics.ProcessStartInfo
            $psi.FileName = $exe; $psi.Arguments = $action
            $psi.UseShellExecute = $false; $psi.CreateNoWindow = $true; $psi.RedirectStandardOutput = $true
            $psi.StandardOutputEncoding = [System.Text.Encoding]::UTF8
            $p = [Diagnostics.Process]::Start($psi)
            $read = $p.StandardOutput.ReadToEndAsync()
            if (-not $p.WaitForExit(900000)) { try { $p.Kill() } catch { }; return 98 }
            $s = $null; if ($read.Wait(30000)) { try { $s = $read.Result | ConvertFrom-Json } catch { } }
            Write-Host "APEX.exe $action : code $($p.ExitCode) ; $($s.headline) / $($s.cause)"
            return $p.ExitCode
          }
          if ((Panel '--start') -gt 1) { Write-Host 'BLOCKED : APEX ne démarre pas'; exit 3 }
          wsl.exe -d $env:DISTRO --cd /home/apex/apex --exec .venv/bin/python "$src/scripts/apex_experience_ab.py" --replicates 4 --timeout-s 600 --out /home/apex/apex-experience-ab | Out-Host
          $code = $LASTEXITCODE
          wsl.exe -d $env:DISTRO --exec bash -c 'cat ~/apex-experience-ab/summary.json 2>/dev/null' | Out-Host
          $null = Panel '--stop'
          exit $code
      - name: MinIO optional profile (Gate M) — build from official sources, start with the profile, healthcheck, stop
        if: always()
        shell: pwsh
        run: |
          $src = (wsl.exe -d $env:DISTRO -u root --exec wslpath -a ($env:GITHUB_WORKSPACE -replace '\\','/')).Trim()
          # En cas d'échec, la fin du journal en annotation (lisible par l'API, sans le journal du runner).
          function Fail([string]$title, [string]$log) {
            $tail = (wsl.exe -d $env:DISTRO -u root --exec tail -n 40 $log) -join "`n"
            $t = $tail -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Host "::error title=${title}::$t"
          }
          # La distribution WSL vit sur C:, qui s'est rempli pendant cette construction (runs 39150876458 et
          # 39155790253 : « There is not enough space on the disk », SIGBUS de Go, puis getpwnam(root) en échec).
          # La place est relevée avant et après, et les modèles, qui ne servent plus, sont retirés d'abord.
          function Space([string]$when) {
            $free = [math]::Round((Get-PSDrive C).Free / 1GB, 1)
            # Sans réponse de WSL (distribution tombée), le relevé de C: reste publié.
            $wsl = try { "$((wsl.exe -d $env:DISTRO -u root --exec df -h --output=avail,size /) | Select-Object -Last 1)".Trim() } catch { '?' }
            Write-Host "::notice title=Place disque ($when)::C: $free Go libres ; WSL / (libre, taille) : $wsl"
          }
          Space 'avant'
          wsl.exe -d $env:DISTRO -u root --exec bash "$src/setup/packaging/windows/ci/free_wsl_space.sh" | Out-Host
          Space 'après nettoyage'
          wsl.exe -d $env:DISTRO -u root --exec bash -c "bash '$src/setup/packaging/windows/ci/build_minio_from_source.sh' 2>&1 | tee /tmp/minio-build.log; exit `${PIPESTATUS[0]}"
          $code = $LASTEXITCODE
          Space 'après construction'
          if ($code -ne 0) { Fail "MinIO : construction (code $code)" /tmp/minio-build.log; exit $code }
          wsl.exe -d $env:DISTRO --cd /home/apex/apex --exec bash -c 'set -o pipefail; (COMPOSE_PROFILES=minio docker compose up -d --wait minio && docker compose ps minio && COMPOSE_PROFILES=minio docker compose stop minio) 2>&1 | tee /tmp/minio-compose.log'
          $code = $LASTEXITCODE
          if ($code -ne 0) { Fail "MinIO : profil compose (code $code)" /tmp/minio-compose.log; exit $code }
          wsl.exe -d $env:DISTRO --exec bash -c 'docker volume ls --filter name=minio-data'
      - name: Validation kit for the user's PC (one folder)
        if: always()
        shell: pwsh
        run: |
          $kit = New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\APEX-validation-kit"
          Copy-Item "$env:RUNNER_TEMP\release\APEX-Setup-x64-v*.exe*", "$env:RUNNER_TEMP\release-prev\APEX-Setup-x64-v*.exe" $kit -ErrorAction SilentlyContinue
          Copy-Item "$env:RUNNER_TEMP\release\manifest.json" "$kit\manifest.json" -ErrorAction SilentlyContinue
          Copy-Item setup/packaging/windows/Test-ApexWindows.ps1, setup/packaging/windows/Valider-APEX.cmd, setup/packaging/windows/LISEZ-MOI.txt, setup/packaging/windows/Prouver-Boucle-APEX.ps1 $kit
          Get-ChildItem $kit | Format-Table Name, Length -AutoSize
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: APEX-validation-kit
          path: ${{ runner.temp }}/APEX-validation-kit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-windows-validation
          path: |
            ${{ runner.temp }}/validation.zip
            ${{ runner.temp }}/validation/**
            ${{ runner.temp }}/release/*.exe
            ${{ runner.temp }}/release/*.sha256
            ${{ runner.temp }}/release/manifest.json
            ${{ runner.temp }}/release/build.log
            ${{ runner.temp }}/release-prev/*.exe
            ${{ runner.temp }}/release-prev/manifest.json
            setup/packaging/windows/Test-ApexWindows.ps1

