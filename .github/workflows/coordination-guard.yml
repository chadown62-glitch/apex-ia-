name: APEX coordination guard

on:
  pull_request:
    branches: [apex/integration]
  pull_request_target:
    branches: [apex/integration]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: PR number to inspect against current integration
        required: true
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  coordination-guard:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      # Only trusted integration is checked out; PR objects are fetched as data.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: apex/integration
          fetch-depth: 0
          persist-credentials: false
      - name: Inspect PR using integration policy and code
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          test -f scripts/coordination_guard.py || { echo 'BLOCKED: trusted guard not bootstrapped'; exit 1; }
          git fetch origin "refs/pull/${PR_NUMBER}/head"
          python3 -I scripts/coordination_guard.py pr --repo "$REPO" --number "$PR_NUMBER"
  adversarial-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Untrusted tests get a read-only token, no secrets and no persisted credentials.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -I -m unittest discover -s tests -p test_coordination_guard.py -v
